# Checks on every push and pull request. The same commands the factory's
# builder and approver run locally (see CLAUDE.md), plus the two things a
# Windows laptop usually can't do quickly: the wasm builds of the workers and
# a browser accessibility scan.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZOLA_VERSION: "0.23.6"

jobs:
  rust:
    name: Rust (fmt, clippy, tests, content)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check articles and case studies
        run: cargo run -q -p newpost -- --check

  workers:
    name: Workers (wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - name: Install worker-build
        run: cargo install -q worker-build --version 0.8.7 --locked
      - name: Build decap-oauth
        working-directory: workers/decap-oauth
        run: worker-build --release
      - name: Build cms-api
        working-directory: workers/cms-api
        run: worker-build --release

  site:
    name: Site (build, links, accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Zola
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zola" --version
      - run: zola --root site build
      - run: zola --root site check --skip-external-links
      - name: No inline scripts or styles in the built pages
        run: |
          if grep -rn '<script' site/public --include='*.html' | grep -v 'src=' | grep -v 'application/ld+json'; then
            echo "Inline <script> found. Move it to site/static/js/."; exit 1
          fi
          if grep -rln 'style="' site/public --include='*.html'; then
            echo "Inline style attribute found. Move it to site/sass/."; exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/shots/package-lock.json
      - name: Install Playwright
        working-directory: tools/shots
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Screenshots and accessibility scan
        run: node tools/shots/shoot.mjs --out target/shots/ci --focus --strict
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: target/shots/ci
          retention-days: 14
