{#- The hero figure: one donation recorded in three systems, like the three
    copies of a carbon receipt book, stamped once they match. -#}

    <p class="slip-system">Donation form</p>
    <dl class="slip-lines">

      <div><dt>Amount</dt><dd>Rp150.000</dd></div>
      <div><dt>Plan</dt><dd>Monthly, card</dd></div>
    </dl>
  </div>
  <div class="slip slip-2" aria-hidden="true">
    <p class="slip-system">Payment gateway</p>
    <dl class="slip-lines">
      <div><dt>Reference</dt><dd>DN-2041</dd></div>
      <div><dt>Settled</dt><dd>Rp150.000</dd></div>
      <div><dt>Status</dt><dd>Captured</dd></div>
    </dl>
  </div>
  <div class="slip slip-3" aria-hidden="true">
    <p class="slip-system">CRM record</p>
    <dl class="slip-lines">
      <div><dt>Reference</dt><dd>DN-2041</dd></div>
      <div><dt>Donor</dt><dd>Recurring, active</dd></div>
      <div><dt>Gift</dt><dd>Rp150.000</dd></div>
